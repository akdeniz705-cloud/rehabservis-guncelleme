<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#12303b">
<meta name="rmsoo" content="rmsoo-sofor-1">
<title>Servis planım</title>
<style>
:root{--ink:#14232a;--soft:#5f6d72;--line:#e2ddd1;--paper:#f7f4ee;--card:#fffefb;--navy:#12303b;--arr:#1d5a7a;--dep:#8a2233;--spc:#7a5a12;--ok:#17703f}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.35 "Times New Roman",Tinos,"Liberation Serif",Times,serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--navy);color:#fff;padding:14px 16px 12px;padding-top:calc(14px + env(safe-area-inset-top))}
header .k{font-size:13px;color:#b9c9cd}
header h1{font-size:23px;margin:2px 0 2px}
header .d{font-size:16px;color:#dfe8ea}
header .m{font-size:13px;color:#b9c9cd;margin-top:4px}
main{padding:10px 12px 24px;max-width:720px;margin:0 auto}
.note{background:#fff3cd;color:#6b4c00;border:1px solid #f0d58a;border-radius:10px;padding:9px 12px;margin:8px 0;font-size:15px}
.info{color:var(--soft);font-size:14px;margin:6px 2px 10px}
.band{margin:16px 0 8px;font-weight:700;font-size:15px;letter-spacing:.4px;color:#fff;border-radius:8px;padding:6px 12px}
.band.arr{background:var(--arr)}.band.dep{background:var(--dep)}.band.spc{background:var(--spc)}
.trip{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 12px;overflow:hidden}
.trip h2{margin:0;font-size:20px;padding:10px 12px 8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.trip h2 small{font-size:14px;color:var(--soft);font-weight:400}
.trip h2 .hs{font-size:13px;background:#f3effc;color:#5a3fb0;border:1px solid #b9a7e6;border-radius:6px;padding:1px 7px;font-weight:700}
.st{display:flex;align-items:stretch;border-bottom:1px solid #efeade;min-height:64px}
.st:last-of-type{border-bottom:0}
.no{flex:0 0 52px;display:flex;align-items:center;justify-content:center;border:0;background:none;font:inherit;padding:0;cursor:pointer}
.no span{width:34px;height:34px;border-radius:50%;background:#eef1ee;color:var(--soft);display:grid;place-items:center;font-weight:700;font-size:16px}
.st.done .no span{background:var(--ok);color:#fff}
.st.done .go b{text-decoration:line-through;color:var(--soft)}
.go{flex:1;display:block;padding:9px 10px 9px 0;color:inherit;text-decoration:none;min-width:0}
.go b{font-size:19px;display:block}
.go .t{display:inline-block;font-size:13px;border:1px solid #d3cbb8;border-radius:6px;padding:0 6px;margin:3px 4px 0 0;color:var(--soft)}
.go .t.r{border-color:#b9a7e6;color:#5a3fb0;background:#f3effc;font-weight:700}
.go .a{display:block;font-size:14.5px;color:var(--soft);margin-top:3px}
.go .a .mh{color:var(--ink);font-weight:700}
.nav{flex:0 0 74px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--arr);text-decoration:none;font-size:12.5px;border-left:1px solid #efeade;gap:2px}
.nav svg{width:26px;height:26px}
.nav.off{color:#b5aea0}
.route{display:block;text-align:center;padding:11px;border-top:1px solid var(--line);color:var(--arr);text-decoration:none;font-weight:700;font-size:16px;background:#f6f9fa}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 16px;margin:14px 0;font-size:17px}
.box h2{margin:0 0 8px;font-size:21px}
.ok{color:var(--ok)}
.btn{display:inline-block;margin-top:10px;background:var(--navy);color:#fff;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:700;text-decoration:none}
footer{color:var(--soft);font-size:12.5px;text-align:center;padding:4px 16px 20px}
</style>
</head>
<body>
<header id="hd"><div class="k">Servis planım</div><h1 id="h1">Şoför sayfası</h1><div class="d" id="hdd"></div><div class="m" id="hdm"></div></header>
<main id="mn"><div class="box">Yükleniyor…</div></main>
<footer>Bu sayfa planı yalnız bu telefonda gösterir; hiçbir yere bilgi göndermez.<br><button type="button" id="unpair" style="margin-top:10px;background:none;border:1px solid #d3cbb8;border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;color:#5f6d72">Bu telefondaki eşleştirmeyi kaldır</button></footer>

  function go() {

    rawP.then(function (raw) { return saveKey(raw, nm); }).then(function (id) { return privMode().then(function (pv) { return pv || !stored(id); }); }).then(function (bad) {

      if (bad) { box('<h2>⚠ Kod bu tarayıcıda saklanamıyor</h2>Bu tarayıcı gizli modda ya da çerezleri engelliyor; eşleştirme sayfa kapanınca silinir ve plan bağlantısı her seferinde kod sorar.<p style="margin:12px 0 0">' + fixHelp() + '</p><p style="margin:12px 0 0">Ayarı düzelttikten sonra QR kodunu yeniden okutun.</p>'); return; }
      box('<h2 class="ok">✓ Telefon eşleştirildi</h2>' + (nm ? '<b>' + esc(nm) + '</b> için ' : '') + 'bu telefon hazır. Bundan sonra WhatsApp\'tan gelen plan bağlantısına dokunduğunuzda günün planı açılır.<p style="margin:12px 0 0;color:#5f6d72;font-size:15px">Plan bağlantısını açınca yine "eşleştirilmemiş" yazarsa, bilgisayardaki QR\'ın altında yazan 12 karakterlik kodu orada bir kez yazmanız yeterli.</p>' + (st(LS, null) ? '<a class="btn" href="#" id="lastBtn">Son planı aç</a>' : ''));
      var lb = document.getElementById('lastBtn'); if (lb) lb.onclick = function (e) { e.preventDefault(); show(st(LS, {}).p, true); };
    }, function () { box('<h2>Eşleştirme kodu geçersiz</h2>Kodu kurumdaki bilgisayardan yeniden okutun.'); });
  } else if (q.get('p')) {
    var f = q.get('p'); clean(); show(f, false);
  } else {
    var last = st(LS, null);
    if (last && last.p) show(last.p, true);
    else box('<h2>Servis planım</h2>' + (Object.keys(st(KS, {})).length ? 'Telefonunuz eşleştirilmiş. Günün planını açmak için WhatsApp\'tan gelen plan bağlantısına dokunun.' : 'Bu sayfa şoförlerin günlük servis planını gösterir. Önce kurumdaki bilgisayardan QR kodu okutarak telefonunuzu eşleştirin.'));
  }
  }
  window.addEventListener('hashchange', function () { if (location.hash.length > 1) { window.scrollTo(0, 0); go(); } });
  document.getElementById('unpair').onclick = function () {
    if (!confirm('Bu telefondaki eşleştirme ve kayıtlı plan silinsin mi? Planları yeniden görmek için kurumdan yeni QR kodu okutmanız gerekir.')) return;
    MEM = {}; try { localStorage.removeItem(KS); localStorage.removeItem(LS); localStorage.removeItem(DS); } catch (e) { }
    document.getElementById('h1').textContent = 'Şoför sayfası'; document.getElementById('hdd').textContent = ''; document.getElementById('hdm').textContent = '';
    box('<h2>Eşleştirme kaldırıldı</h2>Bu telefonda kayıtlı anahtar ve plan silindi. Yeniden kullanmak için kurumdaki bilgisayardan QR kodunu okutun.');
  };
  go();
})();
</script>
